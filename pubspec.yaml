name: jobs_scholarship_board
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  hive_flutter: ^1.1.0
  http: ^1.6.0
  intl: ^0.20.3
  timezone: ^0.11.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/feed.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
